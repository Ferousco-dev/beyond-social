project_id = "beyond-social"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[edge_runtime]
enabled = true

# Both of these are authenticated, but by their own code rather than by the
# platform gate below. Each one rejects a missing Authorization header, then
# resolves the caller with `auth.getUser()` and returns 401 when that fails,
# before touching any data. Every query it then makes runs as that user under
# RLS, so the identity check is load bearing and cannot be skipped.
#
# The platform gate was therefore a second lock on the same door, and it is off
# because the local edge runtime cannot open it: this project issues ES256
# signing keys, and the runtime pinned by our CLI version only implements the
# symmetric path, so it throws before reaching the function at all.
#
# What this costs: an unauthenticated request now reaches the function and is
# refused there instead of at the edge, spending one invocation to say no.
# Turn these back on when the CLI is next upgraded.

# Authenticated: called by the app with the user's JWT.
[functions.generate-video]
verify_jwt = false

# Authenticated: the app polls this to sync a generation's status from kie.ai.
[functions.poll-generation]
verify_jwt = false

# Authenticated: renders a talking avatar from a photo and an audio track.
# Checks likeness consent, the model's availability and the balance before
# dispatching, because the provider charges on submission.
[functions.generate-avatar]
verify_jwt = false

# Authenticated: continues a clip the caller already made. Listed for the same
# reason its siblings are, and left off for the same one: it resolves the caller
# itself and refuses anything it cannot identify, so the platform gate would be
# a second lock on a door this function already holds shut.
[functions.extend-video]
verify_jwt = false

# Public webhook from kie.ai (no JWT); guarded by KIE_CALLBACK_SECRET in the URL.
[functions.kie-callback]
verify_jwt = false

# Cron-triggered, not user-facing: no JWT to verify. Guarded by comparing the
# Authorization header against SUPABASE_SERVICE_ROLE_KEY itself, the one
# secret the triggering cron route and this function already both hold.
[functions.reconcile-generations]
verify_jwt = false

# The analytics container mounts the host Docker socket, which a Colima or
# Lima-backed daemon cannot provide. It powers the local log explorer in Studio
# and nothing the application depends on, so local development turns it off.
# Hosted projects are unaffected: this file configures the local stack only.
[analytics]
enabled = false
