name: Telegram Claude Task

# Started by the Vercel Telegram backend via the GitHub REST API's
# repository_dispatch endpoint (see services/telegram-agent). Independent of
# every other workflow in this repo: nothing about the scheduled
# loop-engineering process or CI is touched by this file, and this workflow
# never runs on a schedule of its own, only on demand.
on:
  repository_dispatch:
    types: [telegram_claude_task]

permissions:
  contents: write
  pull-requests: write
  issues: write
  # claude-code-action requests a short-lived GitHub OIDC token as part of
  # its own auth flow, separate from CLAUDE_CODE_OAUTH_TOKEN; without this
  # the "Run Claude Code" step fails immediately with "Could not fetch an
  # OIDC token" before it ever reaches the actual task.
  id-token: write

concurrency:
  group: telegram-claude-task-${{ github.event.client_payload.task_id }}
  cancel-in-progress: false

jobs:
  run-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TASK_ID: ${{ github.event.client_payload.task_id }}
      TELEGRAM_CHAT_ID: ${{ github.event.client_payload.telegram_chat_id }}
      TELEGRAM_CALLBACK_URL: ${{ secrets.TELEGRAM_CALLBACK_URL }}
      # Named CALLBACK_WEBHOOK_SECRET on GitHub's side: repo secret names
      # can't start with "GITHUB_", that prefix is reserved. The value
      # must match the GITHUB_WEBHOOK_SECRET env var on Vercel, which has
      # no such restriction.
      GITHUB_WEBHOOK_SECRET: ${{ secrets.CALLBACK_WEBHOOK_SECRET }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.client_payload.base_branch || github.ref }}

      - name: Notify Telegram that the task started
        continue-on-error: true
        env:
          TASK_TITLE: ${{ github.event.client_payload.prompt }}
        run: .github/scripts/telegram-callback.sh in_progress

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Every task runs in a fresh session with no memory of any other
          # task, so docs/telegram-agent/JOURNAL.md is the only thing that
          # carries context between them (same role BACKLOG.md plays for
          # loop-engineering) - this appendix is what keeps that file alive
          # without a database.
          prompt: |
            ${{ github.event.client_payload.prompt }}

            ---
            This task was sent through the Telegram engineering bot. If
            docs/telegram-agent/JOURNAL.md exists, skim its last few entries
            first for context from recent related tasks. Append one short
            entry there: today's date, and one to three lines on what was
            asked and what changed or was decided. Add an entry if this
            task changed anything else in the repository, or if it settled
            something a future task would need to know (a clarified
            requirement, a decision, a constraint ruled out) — you have no
            access to the Telegram chat itself, only this file, so that's
            the only way that context survives. Skip it for a purely
            informational exchange with no lasting decision (a one-off
            question with nothing to remember).
          branch_prefix: claude/telegram-
          # Without this, Claude's actual turn-by-turn output and final
          # message are hidden from the log ("full output hidden for
          # security"), leaving only pass/fail metadata. Several real
          # tasks completed with zero permission denials and zero file
          # changes with no way to see why; this repo's code isn't
          # secret from its own CI, so the tradeoff is worth it here.
          show_full_output: true
          # Tool use has no interactive approver in an unattended run, so
          # anything not explicitly allowed here is denied by default: the
          # first real task completed "successfully" with zero file changes
          # because Edit wasn't on this list (permission_denials_count: 1
          # in the run's own output). Bash is unscoped because installing
          # dependencies, running tests, and git operations all go through
          # it; the workflow's own contents/pull-requests/issues
          # permissions and per-branch isolation are the actual boundary.
          claude_args: >-
            --allowedTools "Bash,Edit,Write,Replace"
            ${{ github.event.client_payload.resume_session_id != '' &&
                format('--resume {0}', github.event.client_payload.resume_session_id) || '' }}

      - name: Find the pull request Claude opened
        id: pr
        if: always() && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh pr list --head "${{ steps.claude.outputs.branch_name }}" --json url --jq '.[0].url // ""')
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # Best-effort: lets the actual Telegram message quote what Claude said
      # instead of only a canned status line. See the script for why this
      # is defensive rather than a strict parse.
      - name: Extract Claude's reply text
        id: reply
        if: always() && steps.claude.outputs.execution_file != ''
        run: |
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "text<<${delimiter}"
            .github/scripts/extract-claude-reply.sh "${{ steps.claude.outputs.execution_file }}"
            echo
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Report success to Telegram
        if: always() && steps.claude.outputs.conclusion == 'success' && steps.claude.outputs.branch_name != ''
        env:
          TASK_TITLE: ${{ github.event.client_payload.prompt }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
          REPLY: ${{ steps.reply.outputs.text }}
        run: .github/scripts/telegram-callback.sh success

      # A "success" conclusion only means claude-code-action's own run
      # didn't error; it says nothing about whether Claude actually
      # changed anything. The first real task hit exactly this: it read
      # a file, had its edit silently denied (no tool permission granted),
      # and still reported success with nothing to show for it. Telling
      # the user the truth here is the whole point of this step existing.
      - name: Report no changes made to Telegram
        if: always() && steps.claude.outputs.conclusion == 'success' && steps.claude.outputs.branch_name == ''
        env:
          TASK_TITLE: ${{ github.event.client_payload.prompt }}
          FAILURE_REASON: >-
            Claude finished the run but made no changes to the repository.
            This usually means the task didn't need one, or an edit was
            blocked. Check the run for the real reason.
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
          REPLY: ${{ steps.reply.outputs.text }}
        run: .github/scripts/telegram-callback.sh failure

      - name: Report failure to Telegram
        if: always() && steps.claude.outputs.conclusion != 'success'
        env:
          TASK_TITLE: ${{ github.event.client_payload.prompt }}
          FAILURE_REASON: >-
            Claude did not complete the task successfully. See the run for
            details.
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
          REPLY: ${{ steps.reply.outputs.text }}
        run: .github/scripts/telegram-callback.sh failure
