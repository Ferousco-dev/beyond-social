name: CI/CD

# CI runs on every PR and push. Deployment only runs after checks pass.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beyond_social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Go vet and tests
        working-directory: server
        env:
          GOTOOLCHAIN: go1.27.2
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/beyond_social_test?sslmode=disable
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck lint and tests
        working-directory: client
        run: |
          npx tsc --noEmit
          npx eslint .
          pnpm test

  build-api-image:
    name: Build API image
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${OWNER}/beyond-social-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${OWNER}/beyond-social-api:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ steps.ref.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-api:
    name: Deploy API to Render
    needs: build-api-image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ needs.build-api-image.outputs.image }}
        run: |
          if [ -z "${HOOK}" ]; then
            echo "The RENDER_DEPLOY_HOOK_URL secret is not set." >&2
            exit 1
          fi
          # The hook already carries ?key=..., so the image goes on as an encoded
          # query parameter that curl joins with & (a raw ghcr.io/owner/name:tag
          # has : and / in it, which Render answers with HTTP 400).
          curl --fail-with-body --silent --show-error --max-time 30 \
            --get --data-urlencode "imgURL=${IMAGE_REF}" "${HOOK}"
          echo

      - name: Wait for the new release to be ready
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          API="${API_URL%/}"
          if [ -z "${API}" ]; then
            echo "The API_URL repository variable is not set." >&2
            exit 1
          fi
          # /ready checks the database and names the commit it was built from, so
          # the release being replaced cannot satisfy this check.
          for i in $(seq 1 60); do
            body=$(curl --silent --max-time 10 "${API}/ready" || true)
            status=$(printf '%s' "${body}" | jq -r '.status // empty' 2>/dev/null || true)
            version=$(printf '%s' "${body}" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "${status}" = "ready" ] && [ "${version}" = "${GITHUB_SHA}" ]; then
              echo "API is ready on ${GITHUB_SHA}"
              exit 0
            fi
            echo "Attempt ${i}: status=${status:-none} version=${version:-none}"
            sleep 10
          done
          echo "The API did not report ${GITHUB_SHA} as ready within 10 minutes" >&2
          exit 1

  deploy-web:
    name: Deploy frontend to Vercel
    needs: deploy-api
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
