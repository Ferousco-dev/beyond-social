# Checks every push and pull request. A push to main that passes is deployed:
# the API to Render (by deploy hook, naming the exact commit) and the web app to Vercel.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   RENDER_DEPLOY_HOOK_URL, API_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @beyond-social/web typecheck
      - run: pnpm --filter @beyond-social/web lint
      - run: pnpm --filter @beyond-social/web test

  deploy-api:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy for this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "${HOOK}&ref=${GITHUB_SHA}"
      - name: Wait until the API reports this commit
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          for i in $(seq 1 40); do
            body=$(curl --silent --max-time 20 "${API_URL%/}/ready" || true)
            echo "attempt $i: $body"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\""; then
              echo "The API is running ${GITHUB_SHA}"
              exit 0
            fi
            sleep 15
          done
          echo "The API did not report ${GITHUB_SHA} in time" >&2
          exit 1

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [server, client]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
