# Checks every push and pull request. A push to main that passes is deployed:
# the API to Render (by deploy hook, naming the exact commit), then the web app to Vercel.
# The web app goes second so it never ships against an API that does not have its endpoints yet.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   RENDER_DEPLOY_HOOK_URL, API_URL, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#
# End to end: every pull request and every deploy runs the whole product in a browser against a
# local stack (e2e/stack.sh): local Supabase, the API, and fake kie.ai, Apify and Gemini, so nothing is
# generated or paid for and no secrets are needed. A deploy waits for it.
#
# Fast route, for urgent fixes only: Actions > Check and deploy > Run workflow on main with "fast"
# ticked. Typecheck, lint, unit tests, guards and the malware scan still run; end to end is skipped,
# and the run summary says so in red.
#
# Optional for the malware alert: secret RESEND_API_KEY, and variables ALERT_FROM (a sender
# verified in Resend) and ALERT_TO (defaults to the owner's address).
#
# Third-party actions are pinned to a commit, and the Vercel CLI to a version, so a moved tag
# or a new release cannot change what runs in a deploy. Dependabot proposes the bumps.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast deploy: skip the end-to-end tests (urgent fixes only)"
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  # A newer push to a branch replaces its running checks. Main is never cancelled mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: "65.15.0"
  GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Dependencies match go.sum
        run: go mod verify
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Known vulnerabilities that the code can reach
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @beyond-social/web typecheck
      - run: pnpm --filter @beyond-social/web lint
      - run: pnpm --filter @beyond-social/web test
      # Every mistake we have fixed is a guard; a build that repeats one stops here. See CLAUDE.md.
      - name: Guards against past mistakes
        run: pnpm --filter @beyond-social/web guard
      # GHSA-fc5q-39xc-vjpf (picomatch ReDoS) is ignored on purpose: it is reached only through
      # typescript-eslint, which never runs in the deployed app, and no patched release exists
      # yet (latest is 4.0.7, fix is 4.0.8). Remove the ignore and add a pnpm override once 4.0.8 is out.
      - name: Production dependencies with a high or critical advisory
        run: pnpm audit --prod --audit-level=high --ignore GHSA-fc5q-39xc-vjpf

  e2e:
    if: github.event_name != 'workflow_dispatch' || !inputs.fast
    needs: [server, client]
    # Pinned: Playwright's browsers support Ubuntu 24.04, and ubuntu-latest moved past it.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 2.75.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser for the tests
        run: pnpm --filter @beyond-social/web exec playwright install --with-deps chromium
      - name: Start the local stack (fake providers, nothing is generated)
        run: e2e/stack.sh up
      - name: Every page, every safe button, and the whole journey
        run: pnpm --filter @beyond-social/web e2e
      - name: Keep the report, traces and videos of any failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-report
          include-hidden-files: true
          path: |
            client/e2e/.report
            client/e2e/.results
            e2e/.state/*.log
          retention-days: 14
      - name: Stop the local stack
        if: always()
        run: e2e/stack.sh down

  # Looks for the PolinRider supply-chain malware before anything can be deployed. A match
  # emails the owner (when RESEND_API_KEY is set) and fails the run, so nothing ships.
  malware-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The scanner's own tests
        run: node --test .github/malware-alert/scan.test.mjs
      - name: Scan the tracked files
        id: scan
        run: |
          set +e
          node .github/malware-alert/scan.mjs . > "$RUNNER_TEMP/findings.json"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then echo "No PolinRider signs found."; fi
          if [ "$code" = "1" ]; then
            echo "::error::Possible PolinRider malware found. Files and rules:"
            node -e 'for (const f of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).findings) console.log(`${f.file}:${f.line}  ${f.rule}`)' "$RUNNER_TEMP/findings.json"
          fi
          exit 0
      - name: Email the owner
        if: steps.scan.outputs.code == '1'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          ALERT_TO: ${{ vars.ALERT_TO }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "::warning::RESEND_API_KEY is not available here, so no alert email was sent"; exit 0; fi
          GITHUB_ACTOR="$GITHUB_ACTOR_NAME" node .github/malware-alert/notify.mjs "$RUNNER_TEMP/findings.json"
      - name: Stop here if anything was found
        if: steps.scan.outputs.code != '0'
        run: |
          echo "The scan did not come back clean (exit ${{ steps.scan.outputs.code }}). Nothing will be deployed." >&2
          exit 1

  deploy-api:
    # A deploy needs every check, including end to end, unless the fast route was chosen by hand.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.server.result == 'success' && needs.client.result == 'success' && needs.malware-scan.result == 'success' &&
      (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && inputs.fast))
    needs: [server, client, malware-scan, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Say plainly when end to end was skipped
        if: inputs.fast
        run: |
          echo "### :warning: Fast deploy: the end-to-end tests were skipped for this release" >> "$GITHUB_STEP_SUMMARY"
      - name: Trigger the Render deploy for this commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL is not set" >&2; exit 1; fi
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 5 -X POST "${HOOK}&ref=${GITHUB_SHA}"
      - name: Wait until the API reports this commit
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL is not set" >&2; exit 1; fi
          for i in $(seq 1 40); do
            body=$(curl --silent --max-time 20 "${API_URL%/}/ready" || true)
            echo "attempt $i: $body"
            if echo "$body" | grep -q "\"version\":\"${GITHUB_SHA}\"" && echo "$body" | grep -q '"status":"ready"'; then
              echo "The API is running ${GITHUB_SHA} and reports ready"
              exit 0
            fi
            sleep 15
          done
          echo "The API did not report ${GITHUB_SHA} as ready in time" >&2
          exit 1
      - name: Smoke test the new API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          base="${API_URL%/}"
          check() {
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$base$1" || echo 000)
            echo "$1 -> $code (expected $2)"
            [ "$code" = "$2" ] || { echo "Smoke test failed for $1" >&2; exit 1; }
          }
          check /health 200
          check /ready 200
          # Protected routes must refuse an anonymous caller, not error or disappear.
          check /api/v1/credits 401
          check /api/v1/editor/projects 401

  deploy-web:
    # A deploy needs every check, including end to end, unless the fast route was chosen by hand.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.server.result == 'success' && needs.client.result == 'success' && needs.malware-scan.result == 'success' &&
      (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && inputs.fast)) &&
      needs.deploy-api.result == 'success'
    needs: [server, client, malware-scan, e2e, deploy-api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Required secrets are present
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!name}" ]; then echo "$name is not set" >&2; exit 1; fi
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx --yes vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN"
