name: Security

# Two things the pipeline never checked: whether a secret has been committed,
# and whether the dependencies have known advisories. Both are the sort of
# problem that is cheap to catch continuously and expensive to find late.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Advisories are published against code that has not changed, so this cannot
  # only run on a push. Monday morning, before the week's work starts.
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: a secret that was committed and then removed is still
        # in the history and still needs rotating, and a shallow clone hides it.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The binary rather than the published action, which asks organisations
      # for a licence key. This does the same scan with no such condition.
      - name: Install gitleaks
        run: |
          version=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --config is passed explicitly rather than relying on the file being
      # picked up, so moving or renaming it fails loudly instead of silently
      # falling back to the defaults and going red on the documented
      # placeholders again.
      - name: Scan history for secrets
        run: gitleaks detect --redact --no-banner --config .gitleaks.toml --exit-code 1

      # Belt and braces. The env files are gitignored, but an ignore rule can be
      # edited and a `git add -f` bypasses it entirely, so the thing that must
      # never happen is asserted rather than assumed.
      - name: Assert no env files are tracked
        run: |
          # `.env.example` files are checked in on purpose: they are the
          # template, and they carry names without values.
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::env files are tracked in git:"
            echo "$tracked"
            exit 1
          fi
          echo "no tracked env files"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reported at every level so the summary is useful, but only critical
      # advisories fail the run. A high advisory in a transitive dev dependency
      # blocking an unrelated pull request trains people to ignore the check,
      # which costs more than it catches.
      - name: Report advisories
        continue-on-error: true
        run: pnpm audit --audit-level low

      - name: Fail on critical advisories
        run: pnpm audit --audit-level critical
