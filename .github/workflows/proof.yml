# Review the proof, not the diff: every pull request shows the change working
# (screenshots or a video under "## Proof"), or says it has no visible change.
# Its own workflow, so editing the description re-runs only this check.
name: Proof

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: The proof check's own tests
        run: node --test .github/proof/check.test.mjs
      - name: The pull request shows its proof
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/proof/check.mjs
