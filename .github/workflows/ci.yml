name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: AI gateway behavioural tests
        run: pnpm --filter @beyond-social/ai-gateway test

      - name: Prompt engine tests
        run: pnpm --filter @beyond-social/prompt-engine test

      - name: Publishing tests
        run: pnpm --filter @beyond-social/worker test

      - name: Social OAuth tests
        run: pnpm --filter web test:social

      - name: Analytics tests
        run: pnpm --filter web test:analytics

      - name: Tracing tests
        run: pnpm --filter web test:trace

      - name: SDK tests
        run: pnpm --filter @beyond-social/sdk test

      - name: Validate prompt knowledge base
        run: pnpm --filter @beyond-social/prompt-engine validate
