name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets a deploy be re-run without an empty commit, which matters when a
  # deployment failed for a reason outside the code, such as a rotated token.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # Every deploy job below depends on this one, so a red check here is what
    # stops a release rather than merely reporting one.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: AI gateway behavioural tests
        run: pnpm --filter @beyond-social/ai-gateway test

      - name: Gemini provider tests
        run: pnpm --filter @beyond-social/ai-gateway test:gemini

      - name: Prompt engine tests
        run: pnpm --filter @beyond-social/prompt-engine test

      - name: Publishing tests
        run: pnpm --filter @beyond-social/worker test

      - name: Generation intent tests
        run: pnpm --filter web test:generation

      - name: Optimization tests
        run: pnpm --filter web test:optimization

      - name: Trends tests
        run: pnpm --filter web test:trends

      - name: Social OAuth tests
        run: pnpm --filter web test:social

      - name: Analytics tests
        run: pnpm --filter web test:analytics

      - name: Tracing tests
        run: pnpm --filter web test:trace

      - name: SDK tests
        run: pnpm --filter @beyond-social/sdk test

      - name: Validate prompt knowledge base
        run: pnpm --filter @beyond-social/prompt-engine validate

  # ---------------------------------------------------------------------------
  # Deploys
  #
  # Vercel's own Git integration is switched off in apps/web/vercel.json, so
  # these jobs are the only path to a deployment. That is the whole point: while
  # the integration was live it deployed straight from the push and never looked
  # at whether the tests passed, so a broken main went out anyway.
  #
  # Both jobs `needs: verify`, and a failed job means no deployment happens at
  # all rather than a deployment that is merely marked failed.
  # ---------------------------------------------------------------------------

  deploy-preview:
    name: Deploy preview
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Checked in a step rather than a job-level `if`, because secrets are not
      # available there. This keeps the workflow green before the Vercel
      # credentials are configured instead of failing every run until they are.
      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN is not set, so no preview was deployed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # --archive=tgz because the working tree is large enough that a plain
          # upload has failed on this project before.
          url=$(npx --yes vercel@latest deploy --yes --archive=tgz --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: verify
    # A manual run must be able to deploy, which is the whole reason
    # workflow_dispatch exists here: re-releasing after an environment change
    # should not need an empty commit.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Serialised: two deploys racing to become production is how an older commit
    # ends up live.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not set, so main was not deployed."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --archive=tgz --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check production
        if: steps.creds.outputs.configured == 'true'
        env:
          # The public alias, not the deployment URL the CLI prints. Deployment
          # URLs sit behind Vercel's deployment protection and answer 302 to an
          # SSO redirect, so checking one fails on a deploy that is perfectly
          # healthy. The alias is what visitors actually reach.
          PRODUCTION_URL: https://beyond-social-rust.vercel.app
        run: |
          # A deploy that cannot answer its landing page and health probe is not
          # live, whatever the build said. Without this the job goes green on a
          # bundle that boots and then falls over on the first request.
          for path in / /api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$PRODUCTION_URL$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$path returned $code on $PRODUCTION_URL after deploying."
              exit 1
            fi
          done
