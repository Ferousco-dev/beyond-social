# Fly config for the publishing worker.
#
# `arn` is Stockholm, matching the Supabase project and the render service. The
# worker pulls the finished video down before uploading it to a platform, so the
# distance to storage is paid on every post.
#
# Deploy from the repo root, since the Dockerfile copies workspace packages that
# live above this directory:
#   fly deploy --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile

app = "beyond-social-worker"
primary_region = "arn"

# The queue drains a post at a time and a platform upload is slow. Fly's default
# 5s between SIGTERM and SIGKILL would cut a publish off mid-upload during a
# rolling deploy, leaving a post recorded as sent that never arrived.
kill_timeout = "300s"

[build]

[env]
  WORKER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scaled to zero. A stopped machine holds no Redis connection, so a post
  # that came due while it slept would wait for something else to wake it, which
  # is the failure this service exists to prevent.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  # Nothing here is CPU bound. The work is waiting on a platform API and moving
  # bytes, so the smallest machine is the right one and a bigger one would only
  # wait faster at nothing.
  size = "shared-cpu-1x"
  memory = "512mb"

# All secrets, never listed here:
#   fly secrets set REDIS_URL=... SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... \
#     TIKTOK_CLIENT_KEY=... TIKTOK_CLIENT_SECRET=... \
#     META_APP_ID=... META_APP_SECRET=... \
#     GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... \
#     --config apps/worker/fly.toml
