packages:
  - "client"
  - "packages/*"

overrides:
  # Advisory floors. Next pins older postcss and sharp than the advisories require,
  # and neither is a direct dependency of ours, so the floor has to be set here.
  postcss: "^8.5.23"
  sharp: "^0.35.0"
  # tsup pins esbuild below GHSA-g7r4-m6w7-qqqr's fixed version through
  # bundle-require, reached in the worker's build tooling.
  esbuild: "^0.28.1"
  # Lint-time only, reached through eslint. Patch bumps within the ranges eslint
  # already asks for, so the audit is clean rather than noisy.
  js-yaml@4: "^4.3.1"
  brace-expansion@1: "^1.1.21"
  brace-expansion@5: "^5.0.12"
  source-map-js: "^1.2.2"
  zod@4: "^4.6.6"

# Native packages permitted to run install scripts (they ship prebuilt binaries).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
